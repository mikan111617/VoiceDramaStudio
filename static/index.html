<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VoiceDrama Studio — シナリオから音へ</title>
<link rel="stylesheet" href="/static/style.css?v=026"></head>
<body>
<div id="app">
<header class="topbar">
 <div class="brand"><div class="brand-icon"><svg viewBox="0 0 32 32" fill="none"><path d="M4 18V14M9 23V9M14 27V5M19 23V9M24 19V13M29 16v0" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg></div><div><b>VOICE<span>DRAMA</span></b><small>STUDIO <em>LOCAL</em></small></div></div>
 <button id="projectButton" class="project-name" title="プロジェクトの管理・名前変更">無題の作品 <span>⌄</span></button>
 <div class="top-actions"><span class="status-dot"></span><span id="saveState" class="small muted">読み込み中</span><button id="settingsBtn" class="btn ghost">⚙ 設定</button><button id="exportExcelBtn" class="btn ghost">台本を書き出す</button><button id="renderBtn" class="btn primary">↧ 音声を書き出す</button></div>
</header>
<div class="main-layout">
 <aside class="sidebar">
  <div class="sidebar-top"><div class="section-label">WORKSPACE</div><button class="side-nav active" id="navScript"><span class="nav-icon">▤</span> シナリオ <span class="nav-short">01</span></button><button class="side-nav" id="navVoices"><span class="nav-icon">◉</span> キャスト・声 <span class="nav-short">02</span></button><button class="side-nav" id="navAssets"><span class="nav-icon">♬</span> 音声ライブラリ <span class="nav-short">03</span></button></div>
  <div class="sidebar-divider"></div><div class="side-section-title">SCENES <button id="addSceneBtn" title="シーンを追加">＋</button></div><div id="sceneList" class="scene-list"></div>
  <div class="sidebar-footer"><div class="tip-label">SHORTCUTS</div><div><kbd>Space</kbd> 再生/停止</div><div><kbd>Ctrl</kbd> + <kbd>S</kbd> 保存</div><div class="tiny muted">音声はPC内のworkspaceに保存されます。</div></div>
 </aside>
 <div class="panel-resizer panel-resizer-vertical" id="resizeSidebar" role="separator" tabindex="0" aria-label="サイドバーの幅を調整" aria-orientation="vertical" title="左右にドラッグして幅を変更。ダブルクリックで初期化"></div>
 <main class="editor-panel">
  <div class="panel-heading"><div><div id="editorKicker" class="kicker">SCRIPT EDITOR</div><h1 id="editorTitle">台本を編集</h1><p id="editorSub" class="muted">セリフ・演技指示を直接編集できます</p></div><div class="heading-actions" id="panelActions"></div></div>
  <div class="editor-content" id="editorContent"></div>
 </main>
 <div class="panel-resizer panel-resizer-vertical" id="resizeEditor" role="separator" tabindex="0" aria-label="台本編集とマルチトラックの幅を調整" aria-orientation="vertical" title="左右にドラッグしてマルチトラックを拡大・縮小。ダブルクリックで初期化"></div>
 <section class="workbench">
  <div class="workbench-head"><div class="workbench-title"><span class="tiny amber">PRODUCTION</span><h2>マルチトラック</h2><span class="muted small">台詞・音楽・効果音を重ねる</span></div><div class="transport"><button id="rewindBtn" title="先頭へ">⏮</button><button id="playBtn" class="play-btn" title="再生">▶</button><button id="stopBtn" title="停止">■</button><div id="timeDisplay" class="clock">00:00.0</div><span class="transport-divider"></span><span class="muted small">ZOOM</span><input id="zoom" type="range" min="12" max="110" value="38"><span class="muted tiny" id="zoomNumber">38 px/s</span></div></div>
  <div class="workbench-body"><div class="timeline-shell"><div id="timeline" class="timeline"></div></div><div class="bottom-stats"><span id="timelineInfo">クリップ 0件</span><span>クリップをドラッグして移動 · 右端で長さを調整</span></div></div>
  <div class="panel-resizer panel-resizer-horizontal" id="resizeInspector" role="separator" tabindex="0" aria-label="タイムラインと編集パネルの高さを調整" aria-orientation="horizontal" title="上下にドラッグしてタイムラインの高さを調整。ダブルクリックで初期化"></div>
  <div class="workbench-foot"><div class="inspector-heading"><div><div class="tiny amber">INSPECTOR</div><h3>編集パネル</h3></div><button id="reflowBtn" class="btn ghost mini" title="台詞を順番どおりに並べ直す">↔ 台詞を自動整列</button></div><div id="inspector" class="inspector"></div></div>
 </section>
</div>
</div>
<div id="modalBackdrop" class="modal-backdrop hidden"><div class="modal" id="modalBody"></div></div>
<div id="toasts" class="toasts"></div>
<input type="file" id="excelPicker" accept=".xlsx" hidden>
<input type="file" id="audioPicker" accept="audio/*,.wav,.mp3,.flac,.ogg,.m4a,.aac,.opus" multiple hidden>
<input type="file" id="bulkAudioPicker" accept=".wav,.mp3,.flac,.ogg,.m4a,.aac,.opus,audio/*" multiple hidden>
<script src="/static/app.js?v=026" defer></script>
</body></html>
